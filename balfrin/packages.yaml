packages:
  # patchelf v0.18 leads to errors when it was used to set RPATHS
  #   ELF load command address/offset not properly aligned
  # c.f.  https://github.com/NixOS/patchelf/issues/492
  cray-gtl:
    buildable: true
  cray-mpich:
    buildable: true
  cray-pals:
    buildable: true
  cray-pmi:
    buildable: true
  patchelf:
    require: "@:0.17"
  rdma-core:
    buildable: false
    externals:
    - spec: rdma-core@31.0
      prefix: /usr
  slurm:
    buildable: false
    externals:
    - spec: slurm@23-02-7
      prefix: /usr
  xpmem:
    buildable: false
    externals:
    - spec: xpmem@2.9.6 ~kernel-module
      prefix: /usr
  gcc:
    externals:
      - spec: gcc@7.5.0 languages='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-7
            cxx: /usr/bin/g++-7
            cxx: /usr/bin/gfortran-7
